<html lang="ko"><head><meta charset="utf-8">

<title>호기 작업입력</title>
<style>
:root{--bg:#edf0f2;--sf:#fff;--ink:#18222d;--mute:#5d6b78;--ln:#d5dbe1;--ok:#0e7c66;--bad:#c62828;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12181e;--sf:#1b242c;--ink:#e8edf1;--mute:#93a1ae;--ln:#2d3945;--ok:#3cc5a5;--bad:#ff8a8a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.box{width:min(100%,380px);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:22px 18px 18px}
h1{font-size:17px;margin:0 0 4px}p{margin:0 0 14px;color:var(--mute);font-size:13px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:11px 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
.sw{display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0 2px}.sw input{width:20px;height:20px}
button.go{width:100%;margin-top:12px;padding:11px 14px;border:0;border-radius:8px;background:var(--ink);color:var(--sf);font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.55}
#er{min-height:20px;margin:10px 0 0;color:var(--bad);font-size:13px}
.sh{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 0 0;cursor:pointer}
</style></head><body>
<form class="box" id="f" autocomplete="on">
 <h1>호기 작업입력</h1><p>암호를 입력하면 열려요.</p>
 <input type="text" name="username" value="sbr" autocomplete="username" hidden>
 <input type="password" id="pw" name="password" placeholder="암호" autocomplete="current-password" autofocus>
 <label class="sw"><input type="checkbox" id="rm" checked>이 기기에서 30일 동안 기억하기</label>
 <button class="go" id="go" type="submit">열기</button>
 <div id="er" role="alert"></div>
</form>
